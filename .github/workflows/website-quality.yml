name: Engcode quality

on:
  pull_request:
    paths: ['website/**', 'engcode/**', 'catalog/**', 'mcps/**', 'tools/validate.py', '.github/workflows/website-quality.yml']
  push:
    branches: [main, engcode-catalog]
    paths: ['website/**', 'engcode/**', 'catalog/**', 'mcps/**', 'tools/validate.py', '.github/workflows/website-quality.yml']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python3 tools/validate.py --strict
      - run: python3 -m pytest -q
      - run: node engcode/sync-site.mjs --check
      - run: node --check engcode/cli.mjs
      - run: node website/build.mjs
      - run: node engcode/cli.mjs --list
