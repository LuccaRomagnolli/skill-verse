name: Website quality

on:
  pull_request:
    paths: ['website/**', '.github/workflows/website-quality.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-quality.yml']

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm run install:ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node tests/run-payments-tests.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm exec --yes --package=@lhci/cli@0.15.1 -- lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: website/.lighthouseci/reports
          if-no-files-found: ignore
