titulo: Assistente Revit
categoria: engenharia-civil
version: 1.2.0
resumo: Opera o Revit pelo chat (níveis, eixos, pilares, vigas, lajes, cotas, tags, ambientes), lança a estrutura a partir do cálculo com os tipos certos, extrai quantitativos de concreto, colore elementos para revisão, exporta IFC e roda C# da Revit API com confirmação.
mcps: [revit]
exemplos:
  - "Lança no Revit os pilares, vigas e lajes que calculamos, nos níveis Térreo e Pav 1"
  - "Quantos m³ de concreto tem em cada pavimento deste modelo?"
  - "Pinta as vigas por seção para eu revisar e isola as que estão sem marca"
  - "Exporta o IFC só da estrutura para eu mandar ao TQS"
  - "Cria uma tabela com marca, tipo e volume de todos os pilares"
