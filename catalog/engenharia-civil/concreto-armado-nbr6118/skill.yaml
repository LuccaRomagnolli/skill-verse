titulo: Concreto armado (NBR 6118)
categoria: engenharia-civil
version: 1.3.0
resumo: Dimensiona e verifica vigas, lajes maciças e pilares de concreto armado com memória de cálculo passo a passo, por scripts testados.
mcps: []
exemplos:
  - "Dimensione uma viga biapoiada de 5 m, 15×45 cm, C25, com g = 12 kN/m e q = 6 kN/m"
