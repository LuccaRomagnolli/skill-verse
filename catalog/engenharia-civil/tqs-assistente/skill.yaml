titulo: Assistente TQS
categoria: engenharia-civil
version: 1.1.2
resumo: Orienta o fluxo completo do TQS e automatiza pela API Python oficial (Windows) a leitura e a conferência dos dados do edifício contra a NBR 6118, variantes numa cópia, processamento global em fila, leitura do modelo, conversão para o Revit, exportação de desenhos DXF/PDF e conversões tf↔kN.
mcps: []
exemplos:
  - "Confere se o fck e os cobrimentos do edifício no TQS batem com a CAA do projeto"
  - "Cria uma cópia do edifício com fck 30 e processa as duas versões para eu comparar o aço"
  - "Lista os pilares e vigas que estão lançados no TQS, por pavimento"
  - "Manda o modelo do TQS para o Revit"
  - "Exporta a planta de formas do térreo em DXF para eu montar a prancha"
