id: engenharia-civil
nome: Pack Engenharia Civil
version: 1.3.0
publico: Engenheiros civis, projetistas estruturais e estudantes de Engenharia Civil
descricao: >-
  Cálculo de concreto armado pela NBR 6118, cargas, vento e combinações, memorial de cálculo,
  quantitativos com orçamento SINAPI, laudos técnicos, consulta a NRs/DNIT/SINAPI e o agente operando AutoCAD,
  Revit, SOLIDWORKS, ArchiCAD e TQS.
skills:
  - engenharia-civil/contexto-do-projeto
  - engenharia-civil/concreto-armado-nbr6118
  - engenharia-civil/cargas-combinacoes
  - engenharia-civil/memorial-de-calculo
  - engenharia-civil/quantitativos-sinapi
  - engenharia-civil/autocad-assistente
  - engenharia-civil/revit-assistente
  - engenharia-civil/solidworks-assistente
  - engenharia-civil/tqs-assistente
  - engenharia-civil/archicad-bim-check
  - engenharia-civil/consulta-normas
  - _comum/relatorio-tecnico
mcps:
  - nome: normas-publicas
    opcional: true
  - nome: autocad
    opcional: true
  - nome: archicad
    opcional: true
  - nome: revit
    opcional: true
  - nome: solidworks
    opcional: true
fluxos:
  - titulo: Começar um projeto pelo município
    passos:
      - "Abra o Claude Code/Codex na pasta do projeto e diga: \"Vamos começar um projeto de <uso> em <cidade>/<UF>\" (contexto-do-projeto)."
      - "Responda às perguntas da ficha: uso, pavimentos, área, ambiente e, se souber, o endereço do lote."
      - "O agente pesquisa em fontes oficiais o código de obras, o zoneamento, os Bombeiros e as concessionárias, e registra cada fonte com link e data."
      - "Revise a tabela de exigências que mudam o projeto e as pendências a confirmar com a prefeitura."
  - titulo: Do lançamento ao memorial (pavimento de concreto armado)
    passos:
      - "Descreva o pavimento: \"Tenho 4 lajes, 6 vigas e 6 pilares; as lajes são…\" — o agente organiza o lançamento."
      - "Peça as cargas: \"Quais cargas uso em apartamento com porcelanato e forro de gesso?\" (cargas-combinacoes)."
      - "Calcule as lajes uma a uma e anote as reações nas vigas (concreto-armado-nbr6118)."
      - "Calcule as vigas com essas reações e depois os pilares com a carga acumulada."
      - "Peça: \"Gere o memorial com tudo que calculamos\" (memorial-de-calculo) — sai em Word e PDF."
  - titulo: Do cálculo ao desenho
    passos:
      - "Com uma viga ou pilar calculado, peça: \"Desenhe a seção da V1 no AutoCAD\" (autocad-assistente)."
      - "Sem AutoCAD aberto, peça o DXF: \"Gere o DXF das seções de todos os pilares\"."
  - titulo: Do cálculo ao modelo no Revit
    passos:
      - "Abra o Revit com o projeto e ligue o 'Revit MCP Switch' (faixa Suplementos)."
      - "Peça: \"Lança no Revit os pilares, vigas e lajes que calculamos, nos níveis Térreo e Pav 1\" (revit-assistente)."
      - "Confirme a criação dos tipos de seção (código C# mostrado pelo agente) e confira o modelo em 3D."
      - "Peça: \"Quantos m³ de concreto tem por pavimento?\" e orce com o SINAPI (quantitativos-sinapi)."
  - titulo: Automatizar o TQS
    passos:
      - "No computador com o TQS, abra o Claude Code/Codex e diga: \"Confere os dados do edifício <nome> no TQS\" (tqs-assistente)."
      - "O agente diagnostica o Python/TQS, lê pisos, CAA, fck e cobrimentos e aponta o que não bate com a NBR 6118."
      - "Peça variantes: \"Cria uma cópia com fck 30 e processa as duas para comparar o aço\". O processamento só roda depois do seu sim."
      - "Leve o modelo ao Revit pelo IFC do TQS ou peça \"Manda o modelo do TQS para o Revit\"."
  - titulo: Peça metálica no SOLIDWORKS
    passos:
      - "Abra o SOLIDWORKS e peça: \"Modela uma chapa de base 300x300x16 com 4 furos de 22 mm e me diz o peso\" (solidworks-assistente)."
      - "Confira a captura de tela e a massa (o agente compara com o cálculo do perfil)."
      - "Peça a macro da folha de desenho e o DXF de corte, ou exporte em STEP para o Revit."
  - titulo: Orçamento rápido da estrutura
    passos:
      - "Baixe a planilha SINAPI do seu estado no site da Caixa."
      - "Peça: \"Levante os quantitativos da estrutura e orce com o SINAPI de <mês>, BDI 25%\" (quantitativos-sinapi)."
  - titulo: Modelo BIM pronto para entrega
    passos:
      - "Abra o projeto no ArchiCAD 29 e salve."
      - "Peça: \"Audite o modelo para exportar IFC\" (archicad-bim-check) e corrija o que for apontado."
      - "Exporte as pendências em BCF para a equipe de projeto."
  - titulo: Canteiro e segurança conforme as NRs
    passos:
      - "Peça: \"Monte o checklist da NR-18 para o canteiro desta obra de 4 pavimentos com 30 trabalhadores\" (consulta-normas)."
      - "Cada exigência vem com o item e a página da NR; peça o texto literal quando precisar fundamentar."
      - "Com o AutoCAD conectado: \"Desenhe o layout do canteiro atendendo a esse checklist\"."
  - titulo: Laudo de vistoria com fotos
    passos:
      - "Junte as fotos numa pasta e suas anotações de campo."
      - "Peça: \"Monte um laudo de vistoria com estas fotos e anotações\" (relatorio-tecnico)."
