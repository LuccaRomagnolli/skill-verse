id: engenharia-civil
nome: Pack Engenharia Civil
version: 1.6.0
publico: Engenheiros civis, profissionais de projeto e estudantes de Engenharia Civil
descricao: >-
  Organização persistente de projetos, planta arquitetônica com cortes CAD e planos BIM,
  quantitativos e orçamento SINAPI, relatórios técnicos, consulta a fontes públicas e
  assistência a AutoCAD, Revit, SOLIDWORKS e Archicad com conexões opcionais.
skills:
  - engenharia-civil/contexto-do-projeto
  - engenharia-civil/planta-arquitetonica
  - engenharia-civil/quantitativos-sinapi
  - engenharia-civil/autocad-assistente
  - engenharia-civil/revit-assistente
  - engenharia-civil/solidworks-assistente
  - engenharia-civil/archicad-assistente
  - engenharia-civil/consulta-normas
  - _comum/relatorio-tecnico
mcps:
  - nome: normas-publicas
    opcional: true
  - nome: autocad
    opcional: true
  - nome: archicad
    opcional: true
  - nome: revit
    opcional: true
  - nome: solidworks
    opcional: true
fluxos:
  - titulo: Da planta baixa aos cortes CAD e ao modelo arquitetônico BIM
    passos:
      - "Abra o DWG/DXF no AutoCAD ou forneça PDF/imagem; confirme unidade, origem e duas medidas conhecidas antes de transcrever paredes, aberturas, pisos e linhas de corte."
      - "Para PDF/imagem, calibre pontos em pixels com planta-arquitetonica/scripts/planta.py calibrar; registre níveis, pé-direito, espessuras, peitoris e alturas que a planta não informa."
      - "Valide o planta-arquitetonica.json e gere corte-<id>.dxf e planos-bim.json; confira os cortes no CAD contra a planta original."
      - "Escolha Revit ou Archicad, resolva famílias/favoritos e pavimentos, simule os lotes e confirme antes de modelar; confira IDs, GUIDs e geometria lida de volta no aplicativo."
  - titulo: Retomar um projeto em outra sessão
    passos:
      - "Abra o agente na pasta da obra e diga: 'Retome este projeto pela ficha projeto-contexto.json; mostre decisões, artefatos e pendências antes de avançar'."
      - "Confirme a revisão do projeto e revalide fontes locais cuja vigência possa ter mudado."
      - "Ao concluir cada etapa, registre o arquivo produzido, os alertas e quem fará a revisão técnica."
  - titulo: Começar um projeto pelo município
    passos:
      - "Abra o Claude Code/Codex na pasta do projeto e diga: \"Vamos começar um projeto de <uso> em <cidade>/<UF>\" (contexto-do-projeto)."
      - "Responda às perguntas da ficha: uso, pavimentos, área, ambiente e, se souber, o endereço do lote."
      - "O agente pesquisa em fontes oficiais o código de obras, o zoneamento, os Bombeiros e as concessionárias, e registra edição, artigo, link, data de acesso e vigência."
      - "Revise a tabela de exigências que mudam o projeto e as pendências a confirmar com a prefeitura."
  - titulo: Dos dados conferidos ao desenho
    passos:
      - "Forneça geometria e medidas já conferidas por profissional habilitado; identifique a revisão de origem."
      - "Peça um desenho ou prancha no AutoCAD; confira cotas e escala no aplicativo antes de entregar."
  - titulo: Do desenho ao modelo no Revit
    passos:
      - "Abra o Revit com o projeto e ligue o 'Revit MCP Switch' (faixa Suplementos)."
      - "Forneça posições, níveis e tipos definidos no projeto e peça uma prévia dos elementos a criar (revit-assistente)."
      - "Confirme a criação dos tipos de seção (código C# mostrado pelo agente) e confira o modelo em 3D."
      - "Peça: \"Quantos m³ de concreto tem por pavimento?\" e orce com o SINAPI (quantitativos-sinapi)."
  - titulo: Peça metálica no SOLIDWORKS
    passos:
      - "Abra o SOLIDWORKS e peça: \"Modela uma chapa de base 300x300x16 com 4 furos de 22 mm e me diz o peso\" (solidworks-assistente)."
      - "Confira a captura de tela e a massa (o agente compara com o cálculo do perfil)."
      - "Peça a macro da folha de desenho e o DXF de corte, ou exporte em STEP para o Revit."
  - titulo: Orçamento com quantitativos conferidos
    passos:
      - "Baixe a planilha SINAPI do seu estado no site da Caixa."
      - "Peça: \"Levante os quantitativos da estrutura e orce com o SINAPI de <mês>, BDI 25%\" (quantitativos-sinapi)."
  - titulo: Modelo BIM pronto para entrega
    passos:
      - "Abra o projeto no Archicad 29 ou 30, salve uma cópia e confirme a porta/Tapir com list_instances."
      - "Após alterações confirmadas, releia GUIDs, níveis, materiais e dimensões no aplicativo."
      - "Peça: \"Audite o modelo para exportar IFC\" (archicad-assistente) e corrija o que for apontado."
      - "Exporte as pendências em BCF para a equipe de projeto."
  - titulo: Canteiro e segurança conforme as NRs
    passos:
      - "Peça: \"Monte o checklist da NR-18 para o canteiro desta obra de 4 pavimentos com 30 trabalhadores\" (consulta-normas)."
      - "Cada exigência vem com o item e a página da NR; peça o texto literal quando precisar fundamentar."
      - "Com o AutoCAD conectado: \"Desenhe o layout do canteiro atendendo a esse checklist\"."
  - titulo: Laudo de vistoria com fotos
    passos:
      - "Junte as fotos numa pasta e suas anotações de campo."
      - "Peça: \"Monte um laudo de vistoria com estas fotos e anotações\" (relatorio-tecnico)."
