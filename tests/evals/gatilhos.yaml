    - "Qual sobrecarga uso numa sala de escritório?"
    - "Calcula o vento num galpão de 8 m de altura em Goiânia"
    - "Monta as combinações ELU com peso próprio, uso e vento"
  nao_deve:
    - "Quanto pesa um saco de cimento?"
