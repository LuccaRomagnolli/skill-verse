# Casos de gatilho por skill: pedidos que DEVEM acionar a skill e pedidos parecidos que NÃO devem.
# Use com a skill skill-creator (otimização de description) ou com `claude plugin eval` quando montar a suíte.
concreto-armado-nbr6118:
  deve:
    - "Quanto de aço vai numa viga 15x40 com momento de 60 kN.m?"
    - "Essa laje de 10 cm aguenta um vão de 4,5 m?"
    - "Dimensiona o pilar P3 pra mim, 1200 kN, 3 m de pé-direito"
    - "qual bitola de estribo usar nessa viga"
  nao_deve:
    - "Qual o traço de concreto para fck 25?"
    - "Me explica a diferença entre CA-50 e CA-60 para uma prova"
cargas-combinacoes:
