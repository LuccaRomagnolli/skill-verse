quantitativos-sinapi:
  deve:
    - "Quantos m³ de concreto tem essa estrutura?"
    - "Orça a estrutura com o SINAPI de agosto, BDI 22%"
    - "Qual o código SINAPI de alvenaria de bloco cerâmico 14 cm?"
  nao_deve:
    - "Qual o preço do cimento hoje na minha cidade?"
autocad-assistente:
  deve:
    - "Desenha no AutoCAD a seção da viga V2"
    - "Me gera um DXF com os pilares"
    - "Cria os layers do projeto estrutural"
    - "Monta uma prancha A1 em 1:50 com carimbo"
    - "Limpa essa planta de arquitetura para modelagem BIM"
    - "Qual atalho do AutoCAD pra fazer offset?"
  nao_deve:
    - "Qual a diferença entre DWG e IFC num processo BIM?"
    - "Modela essa viga no Revit"
planta-arquitetonica:
  deve:
    - "Faça o corte A-A desta planta baixa no CAD"
    - "Tenho uma planta em PDF; calibre e gere os cortes verticais"
    - "Modele as paredes, portas e janelas desta planta no Archicad"
    - "Transforme este DWG de arquitetura em um plano de modelagem para o Revit"
  nao_deve:
    - "Desenhe a seção armada da viga V1"
    - "Calcule os esforços desta estrutura"
revit-assistente:
  deve:
    - "Lança esses pilares e vigas no Revit"
    - "Quantos m³ de concreto tem nesse modelo do Revit?"
    - "Cria os níveis e eixos do prédio no Revit"
    - "Pinta as vigas por seção pra eu revisar"
    - "Exporta o IFC da estrutura pro calculista"
  nao_deve:
    - "O que é BIM?"
    - "Audita o modelo do ArchiCAD pra entrega"
solidworks-assistente:
  deve:
    - "Modela uma chapa de base com 4 furos no SolidWorks"
    - "Quanto pesa essa peça metálica?"
    - "Monta a ligação e vê se tem interferência"
    - "Exporta essa peça em STEP"
  nao_deve:
    - "Dimensiona essa viga de aço pela NBR 8800"
    - "Desenha o detalhe da viga de concreto no AutoCAD"
archicad-assistente:
  deve:
    - "O modelo do ArchiCAD tá pronto pra mandar o IFC pro calculista?"
    - "Quais paredes estão sem classificação?"
    - "Gera um BCF com as pendências do modelo"
    - "Modele os pilares, vigas e lajes dessa revisão no Archicad"
  nao_deve:
    - "Como faço uma escada no ArchiCAD?"
relatorio-tecnico:
  deve:
    - "Monta um laudo de vistoria com essas fotos"
    - "Preciso de um parecer técnico sobre abrir essa parede"
    - "Faz o relatório de inspeção predial do condomínio"
  nao_deve:
    - "Resume esse artigo científico"
consulta-normas:
  deve:
    - "O que a NR-18 exige de guarda-corpo?"
    - "Faz o checklist de segurança do canteiro dessa obra"
    - "Qual o critério de medição do SINAPI pra chapisco?"
    - "Quais ensaios o DNIT pede pra base estabilizada granulometricamente?"
  nao_deve:
    - "Me passa o texto completo da NBR 6118"
    - "Qual o preço do aço CA-50 hoje?"
contexto-do-projeto:
  deve:
    - "Vamos começar um projeto de sobrado em Goiânia"
    - "Quais os afastamentos e a taxa de ocupação pra um lote em Curitiba?"
    - "O Corpo de Bombeiros de MG exige o quê pra um prédio de 5 andares?"
    - "A NBR 15575 que vale é de que ano?"
  nao_deve:
    - "Calcula a armadura dessa viga 15x40"
    - "Qual a população de Goiânia?"
